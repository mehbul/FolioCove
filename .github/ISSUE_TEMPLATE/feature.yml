name: Workflow improvement
description: Describe a PDF task that is difficult or missing
title: "[Workflow] "
body:
  - type: markdown
    attributes:
      value: |
        Describe your task using an invented example. This issue is public: do not attach personal documents, document text, passwords, credentials, or private contact details.
        FolioCove keeps document processing on-device. Browser AI is conditional, redaction is experimental, and verified sanitization/PDF/A are unavailable. A request does not promise delivery or change these boundaries.
  - type: input
    id: tool
    attributes:
      label: Relevant tool or workflow
      placeholder: Merge PDFs, extract pages, compress, or another task
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What are you trying to finish?
      description: Explain the desired result and who would use it, without disclosing real document contents.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What makes it difficult today?
      description: Describe the point where you stop, a confusing control, or a missing output. Include an existing workaround if relevant.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would a successful result look like?
      description: Give an observable example, such as preserving page order or opening a downloaded PDF in a phone's Files app.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report check
      options:
        - label: This request contains no personal documents, credentials, or private information.
          required: true
