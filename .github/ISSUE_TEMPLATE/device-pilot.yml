name: Phone or Safari pilot result
description: Record a short physical-device check using synthetic documents
title: "[Device pilot] "
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Use only invented test documents and photos of a blank test page. Do not attach personal PDFs, photos, filenames, passwords, credentials, or private contact details.
        Report what happened on the actual device. Emulation and Playwright WebKit do not establish camera hardware, native downloads, or Apple's Safari-app behavior. This form records observations; submitting it does not mark a device supported.
  - type: input
    id: device
    attributes:
      label: Device model and operating system version
      placeholder: iPhone model / iOS version, Android model / version, or Mac / macOS version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser name and version
      placeholder: Safari 26 or Chrome version
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Public tool URL and date tested
      placeholder: https://mehbul.github.io/FolioCove/scan-pdf/ — YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where was this checked?
      options:
        - Physical device using its normal browser app
        - Browser emulation or an automation engine
    validations:
      required: true
  - type: textarea
    id: camera
    attributes:
      label: Camera and photo import observations
      description: Record whether the picker offered a camera, permission/capture worked, a JPG/PNG appeared, and the orientation looked correct. Write not tested when applicable. HEIC/HEIF import is unsupported.
      placeholder: "Camera offered: / Captured: / Imported type: / Orientation:"
    validations:
      required: true
  - type: textarea
    id: downloads
    attributes:
      label: Download and native open observations
      description: Try a photo-to-PDF output and merging two synthetic PDFs. Record saving through the normal browser flow, opening in Files/Downloads or a PDF viewer, page count, and page order. Write not tested where needed.
      placeholder: "Scan saved/opened: / Merge saved/opened: / Pages/order:"
    validations:
      required: true
  - type: textarea
    id: cancellation
    attributes:
      label: Picker cancellation and limitations
      description: Record whether dismissing the picker leaves the page usable without a download, and whether tool limitations are visible before processing. Include only a non-sensitive error category if it failed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report check
      options:
        - label: This report contains only synthetic test observations and no personal files, credentials, or private information.
          required: true
